name: Continuous Deployment (Vercel)

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm ci

      - name: Run tests (optional)
        run: npm test
        env:
          NODE_ENV: test
          ACCESS_TOKEN_KEY: test-access-token-key
          REFRESH_TOKEN_KEY: test-refresh-token-key
          ACCCESS_TOKEN_AGE: 3000
          PGHOST_TEST: 127.0.0.1
          PGUSER_TEST: developer
          PGPASSWORD_TEST: supersecretpassword
          PGDATABASE_TEST: forumapi_test
          PGPORT_TEST: 5432

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          scope: ${{ secrets.VERCEL_ORG_ID }}
