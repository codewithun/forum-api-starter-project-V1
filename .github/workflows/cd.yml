name: Continuous Deployment (VPS)

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            export NVM_DIR="/root/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            export PATH=$PATH:/root/.nvm/versions/node/v22.14.0/bin

            cd /var/www/forumapi/forum-api-starter-project-V1
            git pull origin main
            # Install production dependencies deterministically
            npm ci || npm install --omit=dev
            # Run DB migrations (loads .env via dotenv/config)
            npm run migrate:prod || true
            # Restart or start service with PM2
            pm2 restart forum-api || pm2 start src/app.js --name forum-api
