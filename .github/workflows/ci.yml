name: Continuous Integration

on:
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: developer
          POSTGRES_PASSWORD: supersecretpassword
          POSTGRES_DB: forumapi_test
        options: |
          --health-cmd="pg_isready -U developer -d forumapi_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      NODE_ENV: test
      PGHOST_TEST: 127.0.0.1
      PGPORT_TEST: 5432
      PGUSER_TEST: developer
      PGPASSWORD_TEST: supersecretpassword
      PGDATABASE_TEST: forumapi_test
      ACCESS_TOKEN_KEY: test-access-token-key
      REFRESH_TOKEN_KEY: test-refresh-token-key
      ACCCESS_TOKEN_AGE: 3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Wait for Postgres
        run: |
          echo "🕐 Waiting for Postgres to be ready..."
          for i in {1..40}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U developer -d forumapi_test; then
              echo "✅ Postgres is ready!"
              break
            fi
            echo "⏳ Still waiting ($i/40)..."
            sleep 3
          done
          sleep 3

      - name: Run DB test migrations
        run: npm run migrate:test

      - name: Run tests
        run: npm test
