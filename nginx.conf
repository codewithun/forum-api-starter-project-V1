# NGINX config template for Forum API (place on your server under /etc/nginx/sites-available/forum-api)
# Copy this file to your server and adjust the domain, certificate paths, and upstream port.

# Rate limit: 90 requests per minute per IP for /threads and subpaths
# Create a key zone for client IPs
limit_req_zone $binary_remote_addr zone=threads_zone:10m rate=90r/m;

# Redirect HTTP to HTTPS (optional but recommended once certs are installed)
server {
    listen 80;
    listen [::]:80;
    server_name your.forum.domain.tld;

    # If using certbot, keep this location for the challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your.forum.domain.tld;

    # TLS certificates (replace with your certbot paths)
    ssl_certificate     /etc/letsencrypt/live/your.forum.domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.forum.domain.tld/privkey.pem;

    # Strong TLS settings (modern)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;  # ~40000 sessions
    ssl_session_tickets off;

    # HSTS (optional): enforces HTTPS for 6 months
    add_header Strict-Transport-Security "max-age=15768000" always;

    # Proxy to Node.js app (adjust port to your app, .env default is 5000)
    set $upstream 127.0.0.1:5000;

    # Default proxy settings
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$upstream;
        proxy_read_timeout 60s;
    }

    # Apply rate limiting on /threads and all nested paths
    location ~ ^/threads(/|$) {
        limit_req zone=threads_zone burst=30 nodelay;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$upstream;
        proxy_read_timeout 60s;
    }
}
