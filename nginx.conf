# forum-api.conf
# NGINX configuration for Forum API
# Membatasi 90 request per menit untuk endpoint /threads dan subpath-nya

# Buat zona penyimpanan untuk limit request berdasarkan IP client
limit_req_zone $binary_remote_addr zone=threads_zone:10m rate=90r/m;

server {
    listen 80;
    server_name your.forum.domain.tld;

    # Redirect HTTP ke HTTPS (optional, jika pakai SSL)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your.forum.domain.tld;

    # Path sertifikat SSL (kalau belum ada, biarin placeholder)
    ssl_certificate     /etc/letsencrypt/live/your.forum.domain.tld/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.forum.domain.tld/privkey.pem;

    # Proxy ke aplikasi Node.js kamu (port default: 5000)
    set $upstream 127.0.0.1:5000;

    # Default proxy untuk semua endpoint
    location / {
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Batasi akses untuk /threads
    location ~ ^/threads(/|$) {
        # Terapkan rate limit (90 req/menit). burst=0 agar kelebihan langsung 429.
        limit_req zone=threads_zone burst=0 nodelay;
        limit_req_status 429;

        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
