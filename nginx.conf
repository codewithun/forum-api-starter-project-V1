# ======================================
# Forum API – NGINX Configuration
# Domain: formapi.online
# ======================================

# Rate-limit zone (90 req / minute per IP) untuk endpoint /threads
limit_req_zone  $binary_remote_addr  zone=threads_zone:10m  rate=90r/m;

########################################
# Redirect HTTP → HTTPS
server {
    listen       80;
    server_name  formapi.online  www.formapi.online;
    return       301 https://$host$request_uri;
}

########################################
# HTTPS server block
server {
    listen       443 ssl http2;
    server_name  formapi.online  www.formapi.online;

    # Path ke sertifikat SSL kamu (Let’s Encrypt atau lainnya)
    ssl_certificate      /etc/letsencrypt/live/formapi.online/fullchain.pem;
    ssl_certificate_key  /etc/letsencrypt/live/formapi.online/privkey.pem;

    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers  on;

    # HSTS (opsional tapi bagus) — agar browser hanya pakai HTTPS
    add_header  Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    # Default location → proxy ke backend API
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Khusus untuk endpoint /threads dan turunannya → aktifkan rate-limit
    location ~ ^/threads(/|$) {
        limit_req          zone=threads_zone  burst=0  nodelay;
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Logging (opsional)
    access_log  /var/log/nginx/formapi_access.log;
    error_log   /var/log/nginx/formapi_error.log;
}
